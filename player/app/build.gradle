// Demo app module. Skeleton: compiles against the stock ijkplayer 0.8.8
// artifacts; for the KDSP demo, replace them with the locally built
// ijkplayer from player/ijkplayer-build.md (flatDir/AAR), which contains
// the kdsp protocol.
plugins {
    id 'com.android.application'
}

android {
    namespace 'demo.kdsp.player'
    compileSdk 34

    defaultConfig {
        applicationId 'demo.kdsp.player'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    // Pinned demo signing key (player/demo-debug.keystore, committed on
    // purpose): with AGP's default debug keystore, every machine/VM that
    // builds this app generates a *different* key, and Android then
    // refuses to install a new build over an existing one. A throwaway
    // demo key committed to the repo keeps every build's signature
    // identical. Never use it for anything but this demo.
    signingConfigs {
        demoDebug {
            storeFile file('../demo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.demoDebug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Locally built ijkplayer (java classes + arm64 .so) whose
    // libijkffmpeg.so contains the KDSP protocol. Built by
    // ../build-ijk-aar.sh; the stock Maven artifacts do not have kdsp.
    implementation(name: 'ijkplayer-kdsp', ext: 'aar')
}
