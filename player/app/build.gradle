// Demo app module. Skeleton: compiles against the stock ijkplayer 0.8.8
// artifacts; for the KPLD demo, replace them with the locally built
// ijkplayer from player/ijkplayer-build.md (flatDir/AAR), which contains
// the kpld protocol.
plugins {
    id 'com.android.application'
}

android {
    namespace 'demo.kpld.player'
    compileSdk 34

    defaultConfig {
        applicationId 'demo.kpld.player'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Stock artifacts (no kpld protocol). Swap for the custom build.
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-arm64:0.8.8'
}
